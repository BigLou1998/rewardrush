<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claim Your Reward | Best Buy</title>
<style>
  :root {
    --bb-yellow: #f0e810;
    --bb-blue: #0046be;
    --bb-blue-dark: #001e73;
    --bb-black: #1d252c;
  }
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    height: 100%;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(165deg, var(--bb-blue) 0%, var(--bb-blue-dark) 55%, #003087 100%);
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    position: relative;
    overflow: hidden;
  }
  #particle-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    pointer-events: none;
  }
  .page {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 500px;
    max-height: 100%;
  }
  .toast {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bb-blue);
    border: 1px solid var(--bb-blue-dark);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    color: #ffffff;
    box-shadow: 0 2px 8px rgba(0, 70, 190, 0.25);
    margin-bottom: 10px;
    animation: fadeSwap 4s infinite;
    flex-shrink: 0;
  }
  .toast .spark {
    font-size: 14px;
    color: var(--bb-yellow);
  }
  @keyframes fadeSwap {
    0%   { opacity: 0; transform: translateY(4px); }
    10%  { opacity: 1; transform: translateY(0); }
    85%  { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-4px); }
  }
  .card {
    position: relative;
    width: 100%;
    max-width: 500px;
    max-height: 100%;
    overflow-y: auto;
    background: #ffffff;
    border: 1px solid #d4dce8;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0, 70, 190, 0.08);
    padding: 0 18px 16px;
  }
  .gift-image {
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 220px;
    padding: 28px 24px;
    background: linear-gradient(160deg, #0046be 0%, #003da8 45%, #001e73 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
    margin-top: 14px;
  }
  .gift-image img {
    width: min(100%, 360px);
    height: auto;
    max-height: 180px;
    display: block;
    margin: 0 auto;
    object-fit: contain;
    object-position: center;
    image-rendering: auto;
    transform: translateZ(0);
  }
  .reward-amount {
    width: 100%;
    text-align: center;
    margin-top: 10px;
  }
  .reward-amount .amount {
    font-family: "Arial Narrow", "Helvetica Neue Condensed", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 38px;
    font-weight: 900;
    letter-spacing: -1px;
    color: var(--bb-blue);
    line-height: 1;
  }
  .reward-amount .label {
    font-family: "Arial Narrow", "Helvetica Neue Condensed", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #55555a;
    margin-top: 4px;
  }
  .steps {
    margin-top: 14px;
    background: rgba(0, 70, 190, 0.06);
    border-radius: 12px;
    padding: 4px 14px;
  }
  .step {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 7px 0;
  }
  .step:not(:last-child) {
    border-bottom: 1px solid rgba(0, 70, 190, 0.08);
  }
  .step-badge {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--bb-blue);
    color: #ffffff;
    font-weight: 700;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .step-text {
    font-size: 13px;
    color: var(--bb-black);
    line-height: 1.25;
  }
  .cta {
    display: block;
    width: 100%;
    text-align: center;
    margin-top: 12px;
    padding: 13px;
    background: var(--bb-yellow);
    color: var(--bb-blue-dark);
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-radius: 12px;
    border: 2px solid var(--bb-yellow);
    transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .cta:hover {
    background-color: var(--bb-blue);
    border-color: var(--bb-blue);
    color: #ffffff;
  }
  .disclaimer {
    text-align: center;
    margin-top: 8px;
    font-size: 10px;
    color: #9a9fa6;
  }
  @media (max-height: 700px) {
    .reward-amount .amount { font-size: 32px; }
    .step { padding: 5px 0; }
    .toast { display: none; }
  }
  @media (max-width: 360px) {
    .reward-amount .amount {
      font-size: 34px;
    }
  }
</style>
</head>
<body>
  <canvas id="particle-canvas"></canvas>
  <div class="page">
    <div class="toast" id="toast">
      <span class="spark">✨</span>
      <span id="toast-text">Sarah M. claimed $500!</span>
    </div>
    <div class="card">
      <div class="gift-image">
        <img
          src="Best-Buy-Logo-transparent.png"
          alt="Best Buy"
          width="1920"
          height="1324"
          decoding="async"
          fetchpriority="high"
        >
      </div>
      <div class="reward-amount">
        <div class="amount">$1000</div>
        <div class="label">Best Buy Gift Card</div>
      </div>
      <div class="steps">
        <div class="step">
          <div class="step-badge">1</div>
          <div class="step-text">Click The Button Below</div>
        </div>
        <div class="step">
          <div class="step-badge">2</div>
          <div class="step-text">Enter Your Email & Basic Info</div>
        </div>
        <div class="step">
          <div class="step-badge">3</div>
          <div class="step-text">Complete Required Offers</div>
        </div>
        <div class="step">
          <div class="step-badge">4</div>
          <div class="step-text">Claim Your Reward</div>
        </div>
      </div>
      <a href="https://trksy.org/aff_c?offer_id=880&aff_id=173683" class="cta">Claim Your $1000 →</a>
      <div class="disclaimer">(Offer not sponsored/endorsed by Best Buy)</div>
    </div>
  </div>
  <script>
    const names = [
      "Sarah M. claimed $500!",
      "James K. claimed $500!",
      "Maria L. claimed $500!",
      "David R. claimed $500!",
      "Emily T. claimed $500!",
      "Michael B. claimed $500!"
    ];
    let index = 0;
    const textEl = document.getElementById("toast-text");
    const toastEl = document.getElementById("toast");
    setInterval(() => {
      index = (index + 1) % names.length;
      textEl.textContent = names[index];
      toastEl.style.animation = "none";
      requestAnimationFrame(() => {
        toastEl.style.animation = "fadeSwap 4s infinite";
      });
    }, 4000);
    const canvas = document.getElementById("particle-canvas");
    const ctx = canvas.getContext("2d");
    let particles = [];
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    function createParticles() {
      const count = 32;
      particles = [];
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 0.2 + Math.random() * 0.3;
        const isYellow = Math.random() < 0.25;
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: 2 + Math.random() * 8,
          opacity: 0.08 + Math.random() * 0.32,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          yellow: isYellow
        });
      }
    }
    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < -p.radius) p.x = canvas.width + p.radius;
        if (p.x > canvas.width + p.radius) p.x = -p.radius;
        if (p.y < -p.radius) p.y = canvas.height + p.radius;
        if (p.y > canvas.height + p.radius) p.y = -p.radius;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        if (p.yellow) {
          ctx.fillStyle = `rgba(240, 232, 16, ${p.opacity + 0.12})`;
        } else {
          ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity * 0.85})`;
        }
        ctx.fill();
      }
      requestAnimationFrame(animateParticles);
    }
    resizeCanvas();
    createParticles();
    animateParticles();
    window.addEventListener("resize", () => {
      resizeCanvas();
      createParticles();
    });
  </script>
</body>
</html>
